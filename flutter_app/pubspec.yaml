name: wakemate
description: 醒伴 WakeMate · 醒时科技 Wakeshift

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.0

  # HTTP + WebSocket
  dio: ^5.4.3
  web_socket_channel: ^3.0.1
  http: ^1.2.1

  # 小智官方终端语音链路
  record: ^6.2.1
  opus_codec: ^3.0.5
  opus_codec_dart: ^3.0.5
  flutter_pcm_sound: ^3.3.3
  flutter_tts: ^4.2.5

  # 本地存储
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # BLE（药珠/摆件配对）
  flutter_blue_plus: ^1.32.12

  # 图表
  fl_chart: ^0.68.0

  # 推送
  firebase_messaging: ^15.0.4
  firebase_core: ^3.3.0

  # 工具
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.3

  # UI 组件
  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0                # 骨架屏加载效果
  flutter_svg: ^2.0.10+1        # SVG 图标

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
